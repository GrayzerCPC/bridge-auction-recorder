name: Publish v1.10 Release

on:
  push:
    paths:
      - '.github/workflows/release-v1.10.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Prepare release APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ../Bridge_Auction_Recorder_v1.10.apk
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.10
          name: Bridge Auction Recorder v1.10
          target_commitish: ${{ github.sha }}
          body: |
            Stable session-trial version of Bridge Auction Recorder.

            Download **Bridge_Auction_Recorder_v1.10.apk** below on an Android phone and open it to install. Because the app is distributed outside Google Play, Android may ask you to allow installation from your browser or Files app.
          files: Bridge_Auction_Recorder_v1.10.apk
